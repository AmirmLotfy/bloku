name: BLOKU qualification and weekly maintenance
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1'
permissions:
  contents: read
concurrency:
  group: bloku-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        chrome: ['145.0.7632.117', stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: B2/package-lock.json
      - run: npm ci --prefix B2
      - run: npm run build:v2 --prefix B2
      - run: npm run typecheck --prefix B2
      - run: npm run test:foundation --prefix B2
      - run: npm run test:engine --prefix B2
      - name: Resolve official Chrome for Testing
        working-directory: B2
        env:
          BLOKU_CI_CHROME: ${{ matrix.chrome }}
        run: node scripts/v2-ci-browser.mjs
      - run: npm run test:engine:browser --prefix B2
      - run: npm run build:v2 --prefix B2
      - run: node B2/store/validate-copy.mjs && node B2/store/validate-ui-locales.mjs
      - run: npm run validate:dnr --prefix B2
      - run: node B2/scripts/v2-release-artifacts.mjs --check-only
      - name: Website static qualification
        if: matrix.chrome == 'stable' && hashFiles('Bloku-Website/package-lock.json') != ''
        run: npm ci --prefix Bloku-Website && npm run check --prefix Bloku-Website && npm audit --prefix Bloku-Website --audit-level=low
      - name: Dependency advisory review
        if: always()
        run: node B2/scripts/v2-dependency-audit.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bloku-${{ matrix.chrome }}-qualification
          path: |
            B2/engine/gate-generated/gate-results.json
            B2/dist/checksums.json
            B2/dist/SBOM.json
            B2/artifacts/maintenance/
          retention-days: 30
          if-no-files-found: warn
