name: CI
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1'
permissions:
  contents: read
concurrency:
  group: bloku-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        chrome: ['145.0.7632.117', stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --prefix extension
      - run: npm run build --prefix extension
      - run: npm run typecheck --prefix extension
      - run: npm test --prefix extension
      - name: Resolve official Chrome for Testing
        working-directory: extension
        env:
          BLOKU_CI_CHROME: ${{ matrix.chrome }}
        run: node scripts/v2-ci-browser.mjs
      - run: npm run test:browser --prefix extension
      - run: npm run build --prefix extension
      - run: npm run validate:locales --prefix extension
      - run: npm run validate:dnr --prefix extension
      - run: node extension/scripts/v2-release-artifacts.mjs --check-only
      - name: Website static qualification
        if: matrix.chrome == 'stable' && hashFiles('website/package-lock.json') != ''
        run: npm ci --prefix website && npm run check --prefix website && npm audit --prefix website --audit-level=low
      - name: Dependency advisory review
        if: always()
        run: node extension/scripts/v2-dependency-audit.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bloku-${{ matrix.chrome }}-qualification
          path: |
            extension/engine/gate-generated/gate-results.json
            extension/dist/checksums.json
            extension/dist/SBOM.json
            extension/artifacts/maintenance/
          retention-days: 30
          if-no-files-found: warn
